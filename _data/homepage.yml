# This is the editorial source of truth for repeatable homepage sections.
# Editors normally only need to change this file and upload media to
# assets/img/content/. See CONTENT_PUBLISHING.md for the publishing workflow.
#
# Rules shared by all sections:
# - `enabled: true` publishes an item; `false` keeps it as a draft.
# - Dates are quoted and use YYYY-MM-DD so YAML does not convert their type.
# - Internal URLs must start with `/`; templates should render them with
#   `relative_url`. External URLs must include https://.
# - Keep every `id` unique and stable after publication.

